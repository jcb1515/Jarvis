[intelligence]
default_model = "qwen3.5:4b"
preferred_engine = "ollama"
provider = "local"
temperature = 0.2
max_tokens = 2048

[agent]
default_agent = "native_openhands"
max_turns = 12
tools = ""
objective = "Operate as a concise, voice-first local personal assistant"
system_prompt_path = "prompts/jarvis-system.md"
default_system_prompt = """
You are Astrono Jarvis, the user's private, locally operated personal AI
assistant. Always identify yourself as Astrono Jarvis. Never call yourself
OpenJarvis, Open Jarvis, Qwen, ChatGPT, Gemini, Claude, or any other product or
model name. Speak with calm confidence and give concise, accurate answers that
sound natural when read aloud.
"""
context_from_memory = true

[speech]
backend = "whisper"
model = "base"
language = ""
device = "auto"
compute_type = "float16"
tts_backend = "auto"
tts_voice = ""
tts_speed = 0.92
auto_speak = true
vad_enabled = true
vad_threshold = 0.5
vad_min_speech_ms = 96
vad_min_silence_ms = 1000
wake_word_enabled = true
wake_word_model = "hey jarvis"
wake_word_threshold = 0.5
wake_word_vad_threshold = 0.35
wake_word_cooldown_ms = 1200

[tools.mcp]
enabled = true
servers = """
[
  {
    "name": "playwright",
    "command": "npx",
    "args": ["-y", "@playwright/mcp@latest"],
    "read_only_tools": ["browser_navigate", "browser_snapshot", "browser_console_messages", "browser_network_requests"],
    "write_tools": ["browser_click", "browser_type", "browser_fill_form", "browser_press_key", "browser_close"],
    "default_mode": "confirm"
  },
  {
    "name": "obsidian",
    "enabled": true,
    "url": "https://${OBSIDIAN_HOST}:${OBSIDIAN_PORT}/mcp/",
    "token": "${OBSIDIAN_API_KEY}",
    "verify_tls": false,
    "read_only_tools": ["vault_list", "vault_read", "vault_get_document_map", "active_file_get_path", "search_query", "search_simple", "tag_list", "command_list"],
    "write_tools": ["vault_write", "vault_append", "vault_patch", "vault_delete", "vault_move", "vault_copy", "command_execute", "open_file"],
    "default_mode": "confirm"
  }
]
"""

[server]
host = "127.0.0.1"
port = 8000
agent = "native_openhands"

[security]
profile = "personal"
